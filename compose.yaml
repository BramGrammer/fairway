# The "local" profile runs by default, see .env.example.

x-editor: &editor
  image: ghcr.io/bramgrammer/fairway:${FAIRWAY_TAG:-latest}
  restart: unless-stopped
  # Caddy's admin socket is created by root inside the Caddy container.
  user: root
  environment: &editor-env
    ADMIN_SOCKET: /run/caddy-admin/admin.sock
    CADDYFILE_PATH: /caddyfile/Caddyfile
    LOG_DIR: /var/log/caddy
    DATA_DIR: /data
    # Where to reach Caddy's HTTPS port from this container, to show served Certificates (see README).
    TLS_PROBE_ADDR: ${TLS_PROBE_ADDR:-}
    # Set to 1 to request each host every 5 minutes and report 502/503/504 as down (needs TLS_PROBE_ADDR).
    HOST_CHECK: ${HOST_CHECK:-}
    # ntfy topic address(es) for Alerts (see README). Secrets: keep them out of the repo. PUBLIC_URL adds a link to each Alert.
    NTFY_URL: ${NTFY_URL:-}
    NTFY_TOKEN: ${NTFY_TOKEN:-}
    PUBLIC_URL: ${PUBLIC_URL:-}
    # The model endpoint for the Assistant and Reviews (see README). Empty address means OpenRouter, empty interval means 24h.
    # Both features need the login below. Keep the key out of the repo.
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-}
    AI_REVIEW_MODEL: ${AI_REVIEW_MODEL:-}
    AI_REVIEW_INTERVAL: ${AI_REVIEW_INTERVAL:-}
    # The Owner's login (see README). Leave AUTH_USER empty to run without a login.
    AUTH_USER: ${AUTH_USER:-}
    AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
    TRUST_PROXY: ${TRUST_PROXY:-}
  volumes:
    - ${CADDY_STACK_DIR}/caddy/CaddyFile:/caddyfile/Caddyfile
    - ${CADDY_STACK_DIR}/caddy/admin:/run/caddy-admin
    - ${CADDY_STACK_DIR}/logs:/var/log/caddy:ro
    - ./data:/data

services:
  editor:
    <<: *editor
    profiles: [local]
    container_name: fairway
    ports:
      - "${EDITOR_BIND:-127.0.0.1}:${EDITOR_PORT:-3000}:3000"
